# Fill in the placeholders after Comparator passes.
project:
  name: "Sharp hypercontractivity for free group von Neumann algebras"
  description: "Verification that the word-length Poisson semigroup on free groups has the sharp hypercontractivity threshold and the logarithmic Sobolev inequality holds with constant 2 on the natural form domain, as shown in the source."
  authors:
    - "Xinyuan Xie"
    - "Haonan Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xinyuan Xie"
    - "Haonan Zhang"

classification:
  arxiv: ["math.OA", "math.FA"]

sources:
  - title: "Sharp hypercontractivity for free group von Neumann algebras"
    authors: ["Xinyuan Xie", "Haonan Zhang"]
    id: "arXiv:2606.03423v3"
    relationship: "formalizes"

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        AI agents drafted and revised the Lean statement, implemented
        the proof, and ran verification under human direction.

review:
  status: "self-assessed"
  notes: >-
    The project owner reviewed and approved the statement and definitions
    before proof development. The solution passed Comparator with Lean,
    NanoDa, and con-ron.
