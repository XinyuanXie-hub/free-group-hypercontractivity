project:
  name: "free-group-hypercontractivity"
  description: >-
    Verification that the word-length Poisson semigroup on free groups has
    the sharp hypercontractivity threshold and that positive Fourier
    polynomials satisfy the log-Sobolev inequality with constant 2, as shown
    in the source.
  authors:
    - "Xinyuan Xie"
    - "Haonan Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xinyuan Xie"
    - "Haonan Zhang"

classification:
  arxiv: ["math.OA", "math.FA"]

sources:
  - title: "Sharp hypercontractivity for free group von Neumann algebras"
    authors: ["Xinyuan Xie", "Haonan Zhang"]
    id: "arXiv:2606.03423v3"
    relationship: "formalizes"

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        AI agents drafted the Lean statements, implemented the proofs, and
        ran verification under human direction.

review:
  status: "self-assessed"
  notes: >-
    The requester reviewed and approved the definitions and statements
    before proof development. Comparator accepted both proofs with Lean,
    NanoDa, and con-ron.
